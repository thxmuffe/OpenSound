services:
  - type: web
    name: parvi-reception-desk
    runtime: docker
    dockerfilePath: ./Services/ReceptionDesk/Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: PARVI_BROKER_BIND
        value: 0.0.0.0
      - key: PORT
        value: 10000
